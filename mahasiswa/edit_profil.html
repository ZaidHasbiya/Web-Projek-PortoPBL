<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Profil | PortoPBL</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" href="../styles.css" type="text/css">
</head>

<body>
  <div class="container my-5">
    <h3 class="mb-4">Edit Profil</h3>

    <form action="#" method="post" enctype="multipart/form-data">
      <div class="mb-3">
        <label for="nama" class="form-label">Nama</label>
        <input type="text" class="form-control" id="name" name="name" placeholder="Nama">
      </div>
      <div class="mb-3">
        <label for="nim" class="form-label">NIM</label>
        <input type="text" class="form-control" id="nim" name="nim" placeholder="NIM">
      </div>

<div class="mb-3">
        <label for="foto" class="form-label">Foto Profil</label>
        <div class="form-text text-danger mb-2">
          File foto berupa jpg, jpeg, dan png dan tidak melebihi 20Mb
        </div>
        <input type="file" class="form-control" id="foto" name="foto" accept=".jpg,.jpeg,.png">
      </div>

      <div class="mb-3">
        <label for="deskripsi" class="form-label">Deskripsi Diri</label>
        <textarea class="form-control" id="deskripsi" name="deskripsi" placeholder="Deskripsi Diri" rows="3"></textarea>
      </div>

      <div class="mb-3">
        <label for="deskripsi" class="form-label">Catatan Prestasi</label>
        <textarea class="form-control" id="deskripsi" name="catatan_prestasi" placeholder="Catatan Prestasi" rows="3"></textarea>
      </div>

<div class="mb-3">
        <label for="jurusan">Pilih Jurusan:</label>
<select id="jurusan" name="jurusan">
  <option value="if">Teknik Informatika</option>
  <option value="tm">Teknik Mesin</option>
  <option value="te">Teknik Elektro</option>
  <option value="mb">Manajemen Bisnis</option>
</select>
      </div>
      <div class="d-flex justify-content-between">
        <a href="lihat_profil_if_mhs.html" class="btn btn-primary">Kembali</a>
        <button type="submit" class="btn btn-success">EDIT</button>
      </div>
    </form>
  </div>

  <img src="../asset/wave-info.svg" class="w-100" alt="">
  <footer class="text-center py-3 bg-light mt-5">
    &copy; <span>2025</span> Tim Web Portofolio Projek PBL
  </footer>

  <script src="../js/bootstrap.bundle.min.js"></script>
</body>
</html>
