<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PortoPBL</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="style_login.css">

    
  </head>
<body>
    <div class="login-form">
    <div class="container mt-5">
        <div class="row justify-content-center">
    <div class="col-12 col-md-4 bg-light p-4 rounded shadow">
    <form id="loginForm">
        <img src="asset/logo.png" class="d-block mx-auto mb-3" alt="Logo" width="220">
        <h3 class="text-center">Login</h3><br>
        <label for="cars">Masuk Sebagai :</label>
    <select name="role" id="role" >
        <option value="Mahasiswa">Mahasiswa</option>
        <option value="Dosen">Dosen</option>
    </select>
        <br>
        <label for="nim">NIM :</label>
            <input type="text" id="nim" class="form-control inputNIM" placeholder="Masukkan NIM Anda">
            <small id="nimError" class="error text-danger">NIM harus diisi!</small>
            <label for="password">Password :</label>
            <input type="password" id="password" class="form-control inputPassword" placeholder="Masukkan Password Anda">
            <small id="passwordError" class="error text-danger">Password harus diisi!</small>

            <div class="d-grid gap-2 mt-4">
              <button type="submit" class="btn btn-info text-white" id="loginBtn">Login</button>
            </div>
          </form>
    <a href="registrasi.html" class="text-center">Belum Punya Akun? Registrasi Disini</a>
</div>    
</div></div></div>
    </div><br><br>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="login.js"></script>
</body>
</html>
