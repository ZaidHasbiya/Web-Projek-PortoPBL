<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PortoPBL</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="style_registrasi.css">
    
  </head>
  
<body>
<div class="form">
<div class="container">
  <div class="row  justify-content-center">
    <div class="col-12 col-md-4 bg-light p-4 rounded shadow">
      <form id="registrationForm">
        <img src="asset/logo.png" class="d-block mx-auto mb-3" alt="Logo" width="200">
        <h3 class="login-title text-center mb-4">Registrasi Akun PortoPBL</h3>

        <div class="mb-3">
          <input type="text" class="form-control fullname"  id="name" placeholder="Nama Lengkap">
          <small id="nameError" class="error">Nama lengkap harus diisi!</small>
        </div>
        <div class="mb-3">
          <input type="text" class="form-control inputnim" id="nim" placeholder="NIM">
          <small id="nimError" class="error">NIM harus diisi!</small>
        </div>
        <div class="mb-3">
          <input type="password" class="form-control password" id="password" placeholder="Password">
          <small id="passwordError" class="error">Password minimal 6 karakter!</small>
        </div>
        <div class="mb-3">
          <input type="password" class="form-control confirm-password" id="confirmPassword" placeholder="Konfirmasi Password">
          <small id="confirmError" class="error">Konfirmasi password harus sama!</small>
        </div>

        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-info text-white">Daftar Sekarang</button>
        </div>
      </form>

      <div class="text-center mt-3">
        <a href="login.html">Sudah Punya Akun? Login Disini</a>
      </div>
    </div>
  </div>
</div>
</div>
<script src="js/bootstrap.bundle.min.js"></script>
<script src="registrasi.js"></script>
</body>
</html>
