<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tambah Dosen</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" type="text/css">
</head>

<body>
  <div class="container my-5">
    <h3 class="mb-4">Tambah Dosen</h3>

    <form action="#" method="post">
      <div class="mb-3">
        <label for="nama" class="form-label">Nama Dosen</label>
        <input type="text" class="form-control" id="name" name="name" placeholder="Nama Dosen">
      </div>
      <div class="mb-3">
        <label for="nik" class="form-label">NIK</label>
        <input type="text" class="form-control" id="name" name="nik" placeholder="NIK">
      </div>
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="name" name="username" placeholder="Username">
      </div>
      <div class="mb-3">
        <label for="role">Pilih Role:</label>
<select id="role" name="role">
  <option value="dosen">Dosen</option>
  <option value="admin">Admin</option>
</select>
      </div>

      <div class="d-flex justify-content-between">
        <a href="data_dosen.html" class="btn btn-primary">Kembali</a>
        <button type="submit" class="btn btn-success">Tambah</button>
      </div>
    </form>
  </div>

  <img src="../asset/wave-info.svg" class="w-100" alt="">
  <footer class="text-center py-3 bg-light mt-5">
    &copy; <span>2025</span> Tim Web Portofolio Projek PBL
  </footer>

  <script src="../js/bootstrap.bundle.min.js"></script>
</body>
</html>
